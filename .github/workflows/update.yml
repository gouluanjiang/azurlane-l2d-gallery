name: Check game updates
on:
  schedule:
    - cron: '17 2 * * 3,6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-catalog-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm test
      - run: npm run validate
      - name: Read announcements and verify new originals
        run: node scripts/check-updates.mjs
      - run: npm run validate
      - name: Publish verified metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json data/skins-data.js data/update-report.json data/review.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified L2D catalog'
            git push origin HEAD:main
          fi
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-failure
          path: data/update-attempt.json
          if-no-files-found: ignore
          retention-days: 14
