<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>碧蓝航线 L2D 图鉴</title>
  <style>
    /* 配色、字体与动效节奏。试玩台（desktop/tryout/player.css）用的是同一套数值。 */
    :root { color-scheme:dark; --bg:#080d17; --panel:#0f1726; --panel-2:#152033; --line:#22314a; --text:#e9f0fb; --muted:#8a9bb6; --cyan:#56d6e6; --gold:#f3c56b; --red:#ff7f9b; --ease:cubic-bezier(.22,1,.36,1); --glass:#ffffff0d; --hair:#ffffff14; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    body { display:flex; flex-direction:column; overflow:hidden; background:radial-gradient(1300px 620px at 50% -12%,#15233d 0,var(--bg) 62%) var(--bg); color:var(--text); font:14px/1.5 "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; color:inherit; }
    button { padding:0; border:0; background:none; cursor:pointer; }
    img { display:block; }
    [hidden] { display:none!important; }
    :focus-visible { outline:2px solid #cfe0ff; outline-offset:2px; }
    .num { font-family:Bahnschrift,"Segoe UI",sans-serif; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
    .ic { width:1.15em; height:1.15em; flex:none; }
    .on > .ic .star, [aria-pressed="true"] > .ic .star { fill:currentColor; }
    .glass { background:#131d30d9; backdrop-filter:blur(22px) saturate(150%); border:1px solid #ffffff1c; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:36px; padding:0 14px; border:1px solid var(--hair); border-radius:11px; background:var(--glass); font-size:13.5px; white-space:nowrap; transition:background .2s,border-color .2s,transform .3s var(--ease),color .2s; }
    .btn:hover { background:#ffffff1a; border-color:#ffffff26; } .btn:active { transform:scale(.96); } .btn:disabled { opacity:.45; cursor:default; }
    .btn[aria-pressed="true"] { border-color:#f3c56b4d; background:#f3c56b14; color:var(--gold); }
    .iconbtn { position:relative; display:grid; place-items:center; width:36px; height:36px; border-radius:50%; color:var(--muted); font-size:17px; transition:background .2s,color .2s,transform .3s var(--ease); }
    .iconbtn:hover { background:#ffffff12; color:var(--text); } .iconbtn:active { transform:scale(.9); } .iconbtn:disabled { opacity:.3; cursor:default; }
    .iconbtn[aria-pressed="true"] { color:var(--gold); }
    .primary { position:relative; display:inline-flex; align-items:center; justify-content:center; gap:9px; height:46px; padding:0 26px; overflow:hidden; border-radius:13px; background:linear-gradient(180deg,#f4dba3,#e0b662); box-shadow:inset 0 1px 0 #fff8,inset 0 -1px 0 #0002,0 8px 24px #e0b6622b; color:#2a1d05; font-size:15px; font-weight:600; letter-spacing:.04em; transition:filter .2s,transform .3s var(--ease),box-shadow .3s; }
    .primary::after { content:""; position:absolute; inset:0; background:linear-gradient(105deg,transparent 35%,#fff9 50%,transparent 65%); transform:translateX(-120%); transition:transform .7s var(--ease); }
    .primary:hover { filter:brightness(1.05); box-shadow:inset 0 1px 0 #fff8,inset 0 -1px 0 #0002,0 12px 30px #e0b66247; } .primary:hover::after { transform:translateX(120%); } .primary:active { transform:scale(.97); }
    .data-error { margin:18px; padding:20px; border:1px solid var(--red); background:#331c2c; line-height:1.7; border-radius:14px; }
    .data-error strong { color:#ffb0c2; } .data-error p { margin:6px 0 12px; }

    /* 顶部：悬浮搜索条 */
    .top { position:relative; z-index:20; display:flex; align-items:center; gap:10px; height:72px; padding:0 16px; flex:none; }
    .brand { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:600; letter-spacing:.06em; white-space:nowrap; }
    .brand i { width:8px; height:22px; background:var(--gold); clip-path:polygon(0 0,100% 20%,100% 100%,0 80%); }
    .brand img { width:26px; height:26px; }
    .top .space { flex:1; }
    .float { position:relative; }
    .pill { display:flex; align-items:center; height:48px; padding:0 6px; border-radius:999px; }
    .search-wrap { display:flex; align-items:center; gap:9px; padding:0 4px 0 12px; color:var(--muted); font-size:16px; }
    #search { width:210px; padding:0; border:0; outline:0; background:none; color:var(--text); font-size:14px; transition:width .5s var(--ease); }
    #search:focus { width:270px; } #search::-webkit-search-cancel-button { display:none; }
    .clear-search { display:grid; place-items:center; width:26px; height:26px; border-radius:50%; color:var(--muted); font-size:14px; }
    .clear-search:hover { background:#ffffff1a; color:var(--text); }
    .pill .div { width:1px; height:20px; margin:0 4px; background:#ffffff24; }
    .seg { position:relative; display:flex; }
    .seg button { position:relative; z-index:1; height:36px; padding:0 15px; border-radius:999px; color:var(--muted); font-size:13.5px; transition:color .3s; }
    .seg button:hover { color:var(--text); } .seg button.active { color:#0b1220; font-weight:600; }
    .seg .seg-thumb { position:absolute; top:0; left:0; width:0; height:36px; border-radius:999px; background:#f1f5fb; transition:transform .5s var(--ease),width .5s var(--ease); }
    .filter-button { display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px; border-radius:999px; font-size:13.5px; transition:background .2s; }
    .filter-button:hover, .filter-button[aria-expanded="true"] { background:#ffffff14; }
    .filter-button i { display:none; width:6px; height:6px; border-radius:50%; background:var(--gold); } .filter-button.has i { display:block; }
    .results { padding:0 12px 0 6px; color:var(--muted); font-size:12.5px; white-space:nowrap; }
    .pop { position:absolute; top:58px; left:50%; width:min(460px,92vw); padding:16px 18px; border-radius:20px; opacity:0; visibility:hidden; transform:translate(-50%,-10px) scale(.96); transform-origin:top; transition:opacity .2s,transform .4s var(--ease),visibility 0s .2s; }
    .pop.open { opacity:1; visibility:visible; transform:translate(-50%,0); transition:opacity .2s,transform .4s var(--ease); }
    .pop h4 { margin:0 0 8px; color:var(--muted); font-size:12px; font-weight:500; } .pop h4:not(:first-child) { margin-top:14px; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; }
    .chips button { height:30px; padding:0 13px; border-radius:999px; background:#ffffff12; font-size:13px; transition:background .2s,color .2s,transform .3s var(--ease); }
    .chips button:hover { background:#ffffff24; } .chips button:active { transform:scale(.94); }
    .chips button.active { background:#f1f5fb; color:#0b1220; font-weight:600; }
    .chips small { margin-left:5px; opacity:.6; font-size:11.5px; }
    .pop-reset { margin-top:14px; color:var(--muted); font-size:12.5px; text-decoration:underline; }
    .rbtn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:44px; min-width:44px; padding:0 13px; border-radius:999px; font-size:13px; white-space:nowrap; transition:background .2s,transform .3s var(--ease),color .2s; }
    .rbtn:hover { background:#1d2a44; } .rbtn:active { transform:scale(.93); } .rbtn .ic { font-size:17px; } .rbtn[aria-pressed="true"] { color:var(--gold); }
    .app-actions { display:flex; align-items:center; gap:10px; }

    /* 主体：网格 + 右侧详情 */
    .cols { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) clamp(300px,27vw,400px); }
    body.wide .cols { grid-template-columns:minmax(0,1fr); } body.wide .detail { display:none; }
    .main { display:flex; flex-direction:column; min-width:0; min-height:0; }
    .bar { display:flex; align-items:center; gap:10px; height:36px; padding:0 18px; flex:none; color:var(--muted); font-size:13px; }
    .bar b { color:var(--text); font-size:15px; font-weight:600; }
    .bar .chip { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 4px 0 10px; border:1px solid var(--hair); border-radius:999px; background:var(--glass); color:var(--text); font-size:12px; }
    .bar .chip button { display:grid; place-items:center; width:18px; height:18px; border-radius:50%; font-size:12px; } .bar .chip button:hover { background:#ffffff26; }
    .grid { flex:1; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(136px,1fr)); grid-auto-rows:max-content; align-content:start; gap:12px; padding:6px 18px 30px; scrollbar-width:thin; scrollbar-color:#2a3b58 transparent; }
    .card { position:relative; aspect-ratio:2/3; min-width:0; overflow:hidden; border-radius:12px; background:var(--panel); contain:layout; transition:transform .5s var(--ease),box-shadow .5s var(--ease); }
    .card:hover, .card:focus-within { transform:translateY(-4px); box-shadow:0 18px 36px #000a; }
    .grid.intro .card { animation:rise .7s var(--ease) both; animation-delay:calc(var(--i,0)*26ms); }
    @keyframes rise { from { opacity:0; transform:translateY(22px) scale(.97); } }
    .media-trigger { position:absolute; inset:0; display:block; width:100%; height:100%; outline-offset:-2px; cursor:pointer; }
    .thumb { width:100%; height:100%; object-fit:cover; object-position:center top; transition:transform .9s var(--ease); }
    .card:hover .thumb, .card:focus-within .thumb { transform:scale(1.06); }
    /* 悬停时其余卡片变暗：只改一层遮罩的不透明度，不重绘图片 */
    .card::before { content:""; position:absolute; inset:0; z-index:1; background:#05080e; opacity:0; pointer-events:none; transition:opacity .45s ease; }
    .grid:hover .card:not(:hover)::before { opacity:.42; }
    .card::after { content:""; position:absolute; inset:0; z-index:3; border:1px solid #ffffff12; border-radius:inherit; pointer-events:none; transition:border-color .3s,box-shadow .3s; }
    .card.selected::after { border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold),inset 0 0 22px #f3c56b33; }
    .fallback { position:absolute; inset:0; display:none; place-items:center; padding:18px; background:linear-gradient(160deg,#13253d,#0a1524); color:var(--muted); font-size:12.5px; line-height:1.7; text-align:center; }
    .card.image-failed .fallback { display:grid; } .card.image-failed .thumb { visibility:hidden; }
    .cap { position:absolute; z-index:2; left:0; right:0; bottom:0; padding:30px 10px 8px; background:linear-gradient(transparent,#060a12d9 70%); font-size:13.5px; font-weight:400; text-shadow:0 1px 6px #000c; pointer-events:none; transform:translateY(19px); transition:transform .5s var(--ease),opacity .35s; }
    .cap .name, .cap .skin { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cap .skin { margin-top:1px; color:#cfd9e8; font-size:11.5px; font-weight:400; opacity:0; transition:opacity .35s; }
    .card:hover .cap, .card:focus-within .cap { transform:none; }
    .card:hover .cap .skin, .card:focus-within .cap .skin { opacity:1; }
    .badges { position:absolute; z-index:2; top:8px; left:8px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; pointer-events:none; }
    .badge { padding:1px 8px; border:1px solid var(--hair); border-radius:999px; font-size:10.5px; line-height:1.6; backdrop-filter:blur(8px); }
    .badge-new { border-color:#f3c56b59; background:#0a1120b3; color:var(--gold); font-family:Bahnschrift,"Segoe UI",sans-serif; font-weight:600; letter-spacing:.12em; }
    .badge.model-availability { background:#0a1120b3; color:#c4cfdd; } .badge.model-availability[data-model-status="review"] { color:#ffd18b; }
    .card-ops { position:absolute; z-index:2; top:6px; right:6px; display:flex; flex-direction:column; gap:5px; }
    .card-ops button { display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:#060a12cc; color:#fff; font-size:14px; opacity:0; transform:scale(.8); backdrop-filter:blur(8px); transition:opacity .3s,transform .4s var(--ease),background .2s,color .2s; }
    .card:hover .card-ops button, .card:focus-within .card-ops button, .card-ops .card-favorite[aria-pressed="true"] { opacity:1; transform:none; }
    .card-ops button:hover { background:var(--gold); color:#231803; }
    .card-ops .card-favorite[aria-pressed="true"] { background:none; backdrop-filter:none; color:var(--gold); filter:drop-shadow(0 1px 2px #000); }
    .card:hover .card-favorite[aria-pressed="true"], .card:focus-within .card-favorite[aria-pressed="true"] { background:#060a12cc; backdrop-filter:blur(8px); filter:none; }
    .card:hover .card-favorite[aria-pressed="true"]:hover { background:var(--gold); color:#231803; }
    .empty-state { display:none; flex:1; place-content:center; justify-items:center; gap:14px; padding:40px 20px; color:var(--muted); text-align:center; }
    .empty-state.visible { display:grid; }

    /* 铺满视图：原图占满窗口，文字和按钮悬停才出现 */
    body.wide .grid { grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:3px; padding:0 3px 3px; }
    body.wide .card { border-radius:0; } body.wide .card:hover, body.wide .card:focus-within { transform:none; box-shadow:none; } body.wide .card::after { display:none; } body.wide .media-trigger { cursor:zoom-in; }
    body.wide .cap { padding:64px 14px 12px; font-size:16px; opacity:0; transform:translateY(12px); }
    body.wide .cap .skin { font-size:12.5px; }
    body.wide .card:hover .cap, body.wide .card:focus-within .cap { opacity:1; transform:none; }
    body.wide .card-ops { top:auto; right:10px; bottom:10px; flex-direction:row; }
    body.wide .card-ops button { width:36px; height:36px; font-size:16px; }
    body.wide .cap .name, body.wide .cap .skin { padding-right:90px; }

    /* 右侧详情 */
    .detail { view-transition-name:detail; position:relative; display:flex; flex-direction:column; gap:12px; min-height:0; margin:0 14px 14px 0; padding:14px; overflow:hidden; border:1px solid var(--hair); border-radius:20px; background:#0d1524; box-shadow:0 20px 50px #0006; }
    .detail > * { position:relative; }
    .detail-ambient { position:absolute; inset:-60px; background-position:center; background-size:cover; filter:blur(60px) saturate(1.4); opacity:.38; transition:background-image .6s ease; pointer-events:none; }
    .detail-art { position:relative; flex:1; min-height:0; overflow:hidden; border-radius:14px; background:#070b13; box-shadow:0 10px 30px #0007; cursor:zoom-in; }
    .detail-art img { position:absolute; inset:-3%; width:106%; height:106%; object-fit:cover; object-position:center top; transition:transform .8s var(--ease); }
    .detail-art .zoom-tip { position:absolute; z-index:2; right:10px; bottom:10px; display:flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:#000a; font-size:12px; opacity:0; transform:translateY(6px); transition:opacity .3s,transform .5s var(--ease); pointer-events:none; }
    .detail-art:hover .zoom-tip, .detail-art:focus-visible .zoom-tip { opacity:1; transform:none; }
    .detail h2 { margin:0; font-size:24px; font-weight:600; line-height:1.2; letter-spacing:.02em; }
    .detail .skin-name { margin-top:3px; color:#c9d6ea; font-size:15px; }
    .detail .meta { display:flex; align-items:center; gap:8px; margin-top:9px; color:var(--muted); font-size:12px; }
    .type-pill { padding:1px 9px; border:1px solid #ffffff26; border-radius:999px; background:var(--glass); }
    .type-pill.type-l2d-plus { color:#cdb6ff; border-color:#cdb6ff55; } .type-pill.type-dual { color:var(--gold); border-color:#f3c56b55; }
    .detail .row { display:flex; gap:8px; } .detail .row > * { flex:1; } .detail .row .btn { height:40px; }
    #detailInfo { padding:2px 4px; }

    /* 原图查看器 */
    body.guide-open .top, body.guide-open .cols { pointer-events:none; }
    .guide-modal { position:fixed; inset:0; z-index:1000; outline:0; }
    .viewer-bg { position:absolute; inset:0; background:#04070cf2; backdrop-filter:blur(18px); opacity:0; transition:opacity .34s ease; }
    .guide-modal.shown .viewer-bg { opacity:1; }
    .viewer-ui { transition:opacity .28s ease; opacity:0; } .guide-modal.shown .viewer-ui { opacity:1; }
    .viewer-head { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:14px; height:58px; padding:0 18px; }
    .viewer-caption { min-width:0; overflow:hidden; font-size:18px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
    .viewer-caption small { margin-left:12px; color:var(--muted); font-size:13px; font-weight:400; }
    .viewer-counter { margin-left:auto; color:var(--muted); font-size:13px; white-space:nowrap; }
    .guide-stage { position:absolute; inset:58px 90px 86px; overflow:hidden; touch-action:none; }
    .guide-stage.zoomed { cursor:grab; } .guide-stage.dragging { cursor:grabbing; }
    .viewer-frame { position:absolute; overflow:hidden; border-radius:6px; will-change:transform; box-shadow:0 30px 90px #000c; }
    .viewer-frame img { position:absolute; inset:0; width:100%; height:100%; user-select:none; -webkit-user-drag:none; }
    #guideImage { opacity:0; transition:opacity .3s ease; } #guideImage.ready { opacity:1; }
    .viewer-nav { position:absolute; top:58px; bottom:86px; display:grid; place-items:center; width:90px; color:#fff8; font-size:30px; transition:color .2s,background .3s; }
    .viewer-nav:hover { color:#fff; background:linear-gradient(90deg,#ffffff10,transparent); }
    #viewerNext { right:0; } #viewerNext:hover { background:linear-gradient(270deg,#ffffff10,transparent); }
    .viewer-nav:disabled { opacity:.15; pointer-events:none; }
    .guide-tools { position:absolute; left:50%; bottom:20px; display:flex; align-items:center; gap:6px; padding:6px; border:1px solid #ffffff1c; border-radius:999px; background:#131d30d9; backdrop-filter:blur(22px) saturate(150%); box-shadow:0 14px 40px #0008; transform:translateX(-50%); }
    .guide-tools .primary { height:38px; padding:0 20px; border-radius:999px; font-size:14px; box-shadow:inset 0 1px 0 #fff8; }
    .viewer-actions { display:contents; }
    .guide-tools .sep { width:1px; height:20px; margin:0 4px; background:var(--line); }
    .zoom-label { min-width:48px; color:var(--muted); font-size:12.5px; text-align:center; }
    .guide-message { position:absolute; z-index:2; inset:0; display:grid; place-content:center; gap:12px; padding:24px; color:#dbe9ff; text-align:center; }
    .guide-message p { margin:0; line-height:1.7; }
    .guide-message-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }

    /* 鼠标停留时的名称提示 */
    .tip { position:fixed; z-index:3000; top:0; left:0; display:flex; align-items:center; gap:8px; max-width:320px; padding:6px 11px; border:1px solid #ffffff24; border-radius:9px; background:#16223af5; box-shadow:0 10px 30px #0009; color:var(--text); font-size:12.5px; line-height:1.5; pointer-events:none; opacity:0; transition:opacity .16s ease,transform .32s var(--ease); }
    .tip.show { opacity:1; }
    .tip kbd { padding:0 6px; border:1px solid #ffffff2e; border-radius:5px; background:#ffffff14; color:var(--gold); font:11.5px/1.6 Bahnschrift,"Segoe UI",sans-serif; }

    /* 筛选时网格淡入；切换视图时整页平滑过渡 */
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration:.34s; animation-timing-function:ease; }
    ::view-transition-old(detail):only-child { animation:.34s var(--ease) both detail-out; }
    ::view-transition-new(detail):only-child { animation:.5s var(--ease) both detail-in; }
    @keyframes detail-out { to { opacity:0; transform:translateX(70px); } } @keyframes detail-in { from { opacity:0; transform:translateX(70px); } }

    @media (max-width:1300px) { #search { width:150px; } #search:focus { width:190px; } }
    @media (max-width:900px) { .cols { grid-template-columns:minmax(0,1fr); } .detail, #viewToggle { display:none; } .brand span { display:none; } .results { display:none; } .guide-stage { inset:58px 8px 86px; } .viewer-nav { width:44px; z-index:3; } }
    @media (max-width:640px) { #search, #search:focus { width:96px; } .seg button { padding:0 10px; } .grid, body.wide .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms!important; animation-delay:0s!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand" id="brand"><i></i><span>L2D 图鉴</span></div>
    <span class="space"></span>
    <div class="float">
      <section class="pill glass" aria-label="搜索与筛选">
        <label class="search-wrap"><span id="searchIcon"></span><input id="search" type="search" autocomplete="off" placeholder="搜索角色或皮肤名" aria-label="搜索角色名或皮肤名"></label>
        <button id="clearSearch" class="clear-search" type="button" aria-label="清空搜索" hidden></button>
        <span class="div"></span>
        <div class="seg" id="modeSwitch" role="group" aria-label="浏览范围">
          <span class="seg-thumb"></span>
          <button class="active" type="button" data-filter="all">全部</button>
          <button type="button" data-filter="new">新上线</button>
          <button id="favoritesOnly" type="button" aria-pressed="false" hidden>收藏</button>
        </div>
        <span class="div"></span>
        <button class="filter-button" id="filterButton" type="button" aria-expanded="false" aria-controls="filterPanel"><span id="filterIcon"></span>筛选<i></i></button>
        <span class="results num" aria-live="polite"><span id="resultCount"></span></span>
      </section>
      <div class="pop glass" id="filterPanel">
        <h4>类型</h4>
        <div class="chips" role="group" aria-label="按类型筛选">
          <button type="button" data-type="L2D" aria-pressed="false">L2D<small data-type-count="L2D"></small></button>
          <button type="button" data-type="L2D+" aria-pressed="false">L2D+<small data-type-count="L2D+"></small></button>

<script>

for(const [selector,name] of [['#searchIcon','search'],['#clearSearch','close'],['#filterIcon','sliders'],['#guideClose','close'],['#viewerPrev','left'],['#viewerNext','right'],['#searchVideo','video'],['#zoomOut','minus'],['#zoomIn','plus'],['#zoomFit','fit'],['#viewerFavorite','star']]) $(selector).innerHTML=icon(name);

// What the view remembers between starts (the search text is not kept).
const STORE_KEY='l2d-gallery-view';

const NEW_DAYS=60;
let skins=[],skinById=new Map(),currentView=[],newSince='',selected=null;

const pointers=new Map();
const searchUrl=(c,s)=>`https://search.bilibili.com/all?keyword=${encodeURIComponent('碧蓝航线 '+c+' '+s+' L2D 彩蛋 教程')}`;

function element(tag,className,text){
  const node=document.createElement(tag);

  if(text!==undefined) node.textContent=text;

}
function isDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const parsed=new Date(value+'T00:00:00Z');
  return Number.isFinite(parsed.getTime())&&parsed.toISOString().slice(0,10)===value;
}
function isLocalImagePath(value,folder){
  if(typeof value!=='string'||!value.startsWith(`assets/${folder}/`)||/[\\:?#\u0000-\u001f\u007f]/.test(value)) return false;
  return value.split('/').every(part=>part&&part!=='.'&&part!=='..'&&!part.includes('%'));
}
function validateData(data){
  if(!data||typeof data!=='object'||Array.isArray(data)) throw new Error('未找到 data/skins-data.js，请保留完整目录；桌面版可在设置里点“检查更新”恢复数据后重试。');
  if(data.schemaVersion!==2) throw new Error('数据格式版本不匹配，请在桌面版的设置里点“检查更新”同步与本页配套的数据。');
  if(typeof data.version!=='string'||!data.version.trim()||!isDate(data.updatedTo)) throw new Error('数据版本或更新日期无效，请重新同步数据。');
  if(data.checkedAt!==null&&data.checkedAt!==undefined&&(typeof data.checkedAt!=='string'||!Number.isFinite(Date.parse(data.checkedAt)))) throw new Error('上次检查时间格式无效，请重新同步数据。');
  if(!Array.isArray(data.skins)||!data.skins.length) throw new Error('皮肤数据为空或格式错误，请重新同步数据。');
  const ids=new Set();
  data.skins.forEach((skin,index)=>{
    const label=`第 ${index+1} 条皮肤数据`;
    if(!skin||typeof skin!=='object'||Array.isArray(skin)) throw new Error(label+'格式错误。');
    for(const field of ['id','character','name','variant','type']){
      if(typeof skin[field]!=='string'||!skin[field].trim()) throw new Error(label+'缺少有效的 '+field+' 字段。');
    }
    if(ids.has(skin.id)) throw new Error(label+'的稳定标识重复，请重新同步数据。');
    ids.add(skin.id);
    if(!['L2D','L2D+','双形态'].includes(skin.type)||!isDate(skin.releaseDate)) throw new Error(label+'的类型或实装日期无效。');
    if(!isLocalImagePath(skin.artworkPath,'skins')||(skin.guidePath!==null&&!isLocalImagePath(skin.guidePath,'guides'))) throw new Error(label+'的本地图片路径无效，请重新同步数据。');
  });
  return data;
}
function showDataError(error){
  $('#dataError').hidden=false;
  $('#dataErrorDetail').textContent=error.message||'数据无法加载，请重新同步后重试。';
  $('#summary').textContent='本地数据不可用';
  $('#content').hidden=true; $('.float').hidden=true; $('#viewToggle').hidden=true;
}
function updatePageMeta(data){
  const dates=skins.map(skin=>skin.releaseDate).sort();
  document.title=`碧蓝航线 L2D 图鉴（更新至 ${data.updatedTo}）`;
  newSince=new Date(Date.now()-NEW_DAYS*864e5).toISOString().slice(0,10);
  $('#summary').textContent=`共 ${skins.length} 款 · ${dates[0]} 至 ${dates[dates.length-1]} · 资料更新至 ${data.updatedTo}`;
  const newCount=skins.filter(isNew).length;
  for(const node of document.querySelectorAll('[data-type-count]')){
    const count=skins.filter(skin=>skin.type===node.dataset.typeCount).length;
    node.textContent=count; node.closest('button').hidden=!count;
  }
  $('[data-filter="new"]').hidden=!newCount;
  if(!newCount&&state.filter==='new') state.filter='all';
  const years=[...new Set(dates.map(date=>date.slice(0,4)))].reverse();
  if(state.year!=='all'&&!years.includes(state.year)) state.year='all';
  const yearFilters=$('#yearFilters');
  yearFilters.replaceChildren();
  for(const year of ['all',...years]){
    const button=element('button','',year==='all'?'全部':year);
    button.type='button'; button.dataset.year=year; yearFilters.appendChild(button);
  }
}
function sortedView(){
  const term=q.value.trim().toLocaleLowerCase('zh-CN');
  const view=skins.filter(skin=>{
    const matchesFilter=state.filter==='all'||(state.filter==='new'&&isNew(skin));
    const matchesYear=state.year==='all'||skin.releaseDate.startsWith(state.year+'-');
    const matchesType=state.type==='all'||skin.type===state.type;
    const matchesFavorite=!state.favoritesOnly||isFavorite(skin);
    const haystack=(skin.character+' '+skin.name).toLocaleLowerCase('zh-CN');
    return matchesFilter&&matchesYear&&matchesType&&matchesFavorite&&haystack.includes(term);
  });
  return view.sort((a,b)=>{
    if(state.sort==='date-desc') return b.releaseDate.localeCompare(a.releaseDate)||a.character.localeCompare(b.character,'zh-CN');
    if(state.sort==='name') return a.character.localeCompare(b.character,'zh-CN')||a.releaseDate.localeCompare(b.releaseDate);
    return a.releaseDate.localeCompare(b.releaseDate)||a.character.localeCompare(b.character,'zh-CN');
  });
}
function paintFavorite(button,skin,label){

function toggleFavorite(skin){
  if(!favorites||!skin) return;

  refreshFavorites();
  Promise.resolve(saveFavorite?.(skin.id,on)).then(saved=>{
    if(Array.isArray(saved)){ favorites=new Set(saved); refreshFavorites(); }
  }).catch(()=>{
    if(on) favorites.delete(skin.id); else favorites.add(skin.id);
    refreshFavorites();
  });
}
// Repaints every star in place; the grid is rebuilt only when "收藏" is the current filter.
function refreshFavorites(){
  if(state.favoritesOnly){ render({keepScroll:true}); }
  else for(const button of grid.querySelectorAll('.card-favorite')){ const skin=skinById.get(button.dataset.favorite); paintFavorite(button,skin,`${skin.character}「${skin.name}」`); }
  paintDetail(false); paintViewerFavorite();
}
function createCard(skin,index){
  const card=element('article','card'+(skin===selected?' selected':'')); card.dataset.skinId=skin.id; card.style.setProperty('--i',Math.min(index,30));

function paintControls(){

  for(const node of old){ const fade=node.animate([{opacity:1},{opacity:0}],{duration:ms(animate?420:0),easing:'ease',fill:'forwards'}); fade.onfinish=()=>node.remove(); }
  if(animate) image.animate([{transform:'scale(1.06)'},{transform:'none'}],{duration:ms(900),easing:EASE});
  if(useThumbs){ const full=new Image(); full.src=skin.artworkPath; full.decode().then(()=>{ if(selected===skin) image.src=full.src; }).catch(()=>{}); }
  const info=$('#detailInfo'),meta=element('div','meta');
  meta.append(element('span','type-pill '+typeClass(skin.type),skin.type),element('span','num',skin.releaseDate));
  if(isNew(skin)){ const fresh=element('span','','新上线'); fresh.style.color='var(--gold)'; meta.append(fresh); }
  info.replaceChildren(element('h2','',skin.character),element('div','skin-name',skin.name),meta);
  if(animate) info.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:ms(450),easing:EASE});
}
function select(skin,{animate=true}={}){
  if(!skin) return;
  selected=skin; saveView({selected:skin.id});
  for(const card of grid.querySelectorAll('.card')) card.classList.toggle('selected',card.dataset.skinId===skin.id);
  paintDetail(animate);
}
function playSkin(skin){ if(skin&&isPlayable(skin)) tryout.open(skin.id); }

/* ----- 原图查看器 ----- */
function applyGuideTransform(){
  viewerFrame.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  guideStage.classList.toggle('zoomed',zoom>1.005);
  zoomLabel.textContent=!imageReady?'加载中':zoom<=1.005?'适应':`${Math.round(zoom*base.w/natural.w*100)}%`;
}
// Fits the picture into the stage; zoom 1 means "fits the window".
function layoutGuide(){
  const width=Math.max(1,guideStage.clientWidth-16),height=Math.max(1,guideStage.clientHeight-16);
  const scale=Math.min(width/natural.w,height/natural.h,1);
  base={w:natural.w*scale,h:natural.h*scale};
  Object.assign(viewerFrame.style,{width:base.w+'px',height:base.h+'px',left:(guideStage.clientWidth-base.w)/2+'px',top:(guideStage.clientHeight-base.h)/2+'px'});
}
const maxZoom=()=>Math.max(1,natural.w/base.w*3);
function setZoom(next,{resetPan=false}={}){
  zoom=Math.max(1,Math.min(maxZoom(),next));
  if(resetPan||zoom===1){ panX=0; panY=0; }
  applyGuideTransform();
}
function fitGuide(){ layoutGuide(); setZoom(1,{resetPan:true}); }
function actualGuide(){ setZoom(natural.w/base.w,{resetPan:true}); }
function updateImageState(status){
  imageReady=status==='ready';
  guideImage.classList.toggle('ready',imageReady);
  // While the full picture loads, the card's small picture stands in; the text only shows on failure.
  guideMessage.hidden=status!=='error'; guideRecovery.hidden=status!=='error';
  viewerFrame.hidden=status==='error';
  if(status==='error') guideMessageText.textContent='这张图片还没有下载到本机，或文件已损坏。可以重试，或同步后再看。';
  if(imageReady&&guideImage.naturalWidth){ natural={w:guideImage.naturalWidth,h:guideImage.naturalHeight}; layoutGuide(); }
  applyGuideTransform();
}
function paintViewerFavorite(){
  const button=$('#viewerFavorite'); button.hidden=!favorites||!activeViewer;
  if(favorites&&activeViewer) paintFavorite(button,activeViewer,`${activeViewer.character}「${activeViewer.name}」`);
}
function paintViewerPlay(){ const play=$('#viewerPlay'); if(!play) return; play.hidden=!activeViewer||!isPlayable(activeViewer); $('#viewerPlayGap').hidden=play.hidden; }
function updateViewerChrome(){
  const index=currentView.indexOf(activeViewer);
  viewerCaption.replaceChildren(activeViewer.character,element('small','',`${activeViewer.name} · ${activeViewer.type} · ${activeViewer.releaseDate}`));
  viewerCounter.textContent=index>=0?`${index+1} / ${currentView.length}`:'';
  viewerPrev.disabled=index<=0; viewerNext.disabled=index<0||index>=currentView.length-1;
  for(const neighbour of [currentView[index-1],currentView[index+1]]) if(neighbour) new Image().src=neighbour.artworkPath;
  guideModal.dataset.skinId=activeViewer.id; paintViewerFavorite(); paintViewerPlay();
  guideModal.dispatchEvent(new CustomEvent('viewer-change',{detail:{skinId:activeViewer.id,mode:'artwork'}}));
}
function showArtwork({retry=false,direction=0}={}){
  if(!activeViewer) return;
  const source=activeViewer.artworkPath;
  const label=`${activeViewer.character}「${activeViewer.name}」皮肤原图`;
  guideModal.setAttribute('aria-label',label); guideImage.alt=label;
  updateViewerChrome();
  pointers.clear(); guideStage.classList.remove('dragging'); zoom=1; panX=0; panY=0; dragMoved=false;
  guidePreview.src=thumbPath(activeViewer);
  updateImageState('loading');
  if(retry) guideImage.removeAttribute('src');
  if(guideImage.getAttribute('src')!==source) guideImage.src=source;
  if(guideImage.complete){
    if(guideImage.naturalWidth) updateImageState('ready'); else updateImageState('error');
  }
  if(direction) viewerFrame.animate([{opacity:0,transform:`translateX(${direction*70}px) scale(.97)`},{opacity:1,transform:'none'}],{duration:ms(480),easing:EASE});
}
function flip(rect){ const now=viewerFrame.getBoundingClientRect(); return `translate(${rect.left-now.left}px,${rect.top-now.top}px) scale(${rect.width/now.width},${rect.height/now.height})`; }
function openViewer(skin,from){
  if(!skin) return;
  if(closing){ closing.cancel(); closing=null; }
  const wasHidden=guideModal.hidden;
  if(wasHidden) guideReturnFocus=document.activeElement;
  activeViewer=skin;
  guideModal.hidden=false; document.body.classList.add('guide-open');
  layoutGuide(); showArtwork();
  requestAnimationFrame(()=>guideModal.classList.add('shown'));
  // Grows out of the card's picture.
  const rect=wasHidden&&from?.getBoundingClientRect();
  if(rect&&rect.width) viewerFrame.animate([{transformOrigin:'0 0',transform:flip(rect)},{transformOrigin:'0 0',transform:'none'}],{duration:ms(560),easing:EASE});
  guideClose.focus({preventScroll:true});
}
function stepViewer(delta){
  const index=currentView.indexOf(activeViewer),next=currentView[index+delta];
  if(index<0) return;
  if(!next){ viewerFrame.animate([{transform:'none'},{transform:`translateX(${-delta*18}px)`},{transform:'none'}],{duration:ms(300),easing:EASE}); return; }
  activeViewer=next; select(next,{animate:false}); cardOf(next)?.scrollIntoView({block:'nearest'});
  showArtwork({direction:delta});
}
function closeGuide(){
  if(guideModal.hidden||closing) return;
  const finish=()=>{
    closing=null; guideModal.hidden=true; guideModal.classList.remove('shown'); document.body.classList.remove('guide-open');
    pointers.clear(); guideStage.classList.remove('dragging');
    const target=cardOf(activeViewer)?.querySelector('.media-trigger')||guideReturnFocus;
    if(target&&target.isConnected) target.focus({preventScroll:true});
  };
  zoom=1; panX=0; panY=0; applyGuideTransform();
  guideModal.classList.remove('shown');
  const rect=cardOf(activeViewer)?.querySelector('.thumb')?.getBoundingClientRect();
  const visible=rect&&rect.width&&rect.bottom>0&&rect.top<innerHeight&&!viewerFrame.hidden;
  closing=viewerFrame.animate(visible
    ?[{transformOrigin:'0 0',transform:'none'},{transformOrigin:'0 0',transform:flip(rect)}]
    :[{opacity:1,transform:'none'},{opacity:0,transform:'scale(.94)'}],{duration:ms(420),easing:EASE});
  closing.onfinish=finish;
}

/* ----- 事件 ----- */
grid.addEventListener('click',event=>{
  const favorite=event.target.closest('.card-favorite'); if(favorite) return toggleFavorite(skinById.get(favorite.dataset.favorite));
  const play=event.target.closest('.card-play'); if(play) return playSkin(skinById.get(play.dataset.tryout));
  const artwork=event.target.closest('[data-open-artwork]'); if(!artwork) return;
  const skin=skinById.get(artwork.dataset.skinId);
  select(skin);
  // Standard view: a mouse click selects and a double click opens. Enter (or the wide view) opens at once.
  if(wide||event.detail===0) openViewer(skin,artwork.querySelector('.thumb'));
});
grid.addEventListener('dblclick',event=>{
  const artwork=event.target.closest('[data-open-artwork]');
  if(artwork&&!wide) openViewer(skinById.get(artwork.dataset.skinId),artwork.querySelector('.thumb'));
});
grid.addEventListener('focusin',event=>{
  const artwork=event.target.closest('[data-open-artwork]'),skin=artwork&&skinById.get(artwork.dataset.skinId);
  if(skin&&skin!==selected) select(skin);
});
// Arrow keys move between cards; F favorites and P plays the focused card.
grid.addEventListener('keydown',event=>{
  const card=event.target.closest('.card'); if(!card) return;
  const cards=[...grid.querySelectorAll('.card')],index=cards.indexOf(card);
  const columns=cards.filter(node=>node.offsetTop===card.offsetTop).length||1;
  const move={ArrowLeft:-1,ArrowRight:1,ArrowUp:-columns,ArrowDown:columns}[event.key],skin=skinById.get(card.dataset.skinId);
  if(move){
    event.preventDefault(); const next=cards[index+move]?.querySelector('.media-trigger');
    if(next){ next.focus({preventScroll:true}); next.scrollIntoView({block:'nearest',behavior:reducedMotion?'auto':'smooth'}); }
  }else if(event.key.toLowerCase()==='f') toggleFavorite(skin);
  else if(event.key.toLowerCase()==='p') playSkin(skin);
});
grid.addEventListener('scroll',()=>saveView({scroll:grid.scrollTop}),{passive:true});
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{ state.filter=button.dataset.filter; state.favoritesOnly=false; render(); }));
$('#favoritesOnly').addEventListener('click',()=>{ state.favoritesOnly=!state.favoritesOnly; if(state.favoritesOnly) state.filter='all'; render(); });
$('#yearFilters').addEventListener('click',event=>{ const button=event.target.closest('[data-year]'); if(!button) return; state.year=button.dataset.year; render(); });
// Type: one at a time; clicking the selected type again shows every type.
document.querySelectorAll('[data-type]').forEach(button=>button.addEventListener('click',()=>{ state.type=state.type===button.dataset.type?'all':button.dataset.type; render(); }));
$('#sortChips').addEventListener('click',event=>{ const button=event.target.closest('[data-sort]'); if(!button) return; state.sort=button.dataset.sort; render(); });
sortOrder.addEventListener('change',()=>{ state.sort=sortOrder.value; render(); });
$('#clearFilters').addEventListener('click',()=>{ state.type='all'; state.year='all'; render(); });
$('#activeChips').addEventListener('click',event=>{
  const key=event.target.closest('[data-clear]')?.dataset.clear; if(!key) return;
  if(key==='search') q.value=''; else state[key]='all';
  render();
});
const filterPanel=$('#filterPanel');
function toggleFilters(open=!filterPanel.classList.contains('open')){ filterPanel.classList.toggle('open',open); $('#filterButton').setAttribute('aria-expanded',String(open)); }
$('#filterButton').addEventListener('click',()=>toggleFilters());
document.addEventListener('pointerdown',event=>{ if(!event.target.closest('#filterPanel,#filterButton')) toggleFilters(false); });
$('#viewToggle').addEventListener('click',()=>setWide(!wide));
q.addEventListener('input',()=>render());
clearSearch.addEventListener('click',()=>{ q.value=''; q.focus(); render(); });
$('#resetFilters').addEventListener('click',resetFilters);
$('#reloadData').addEventListener('click',()=>window.location.reload());
$('#detailArt').addEventListener('click',()=>openViewer(selected,cardOf(selected)?.querySelector('.thumb')));
$('#detailPlay').addEventListener('click',()=>playSkin(selected));
$('#detailFavorite').addEventListener('click',()=>toggleFavorite(selected));
const openVideo=skin=>{ if(skin) window.open(searchUrl(skin.character,skin.name),'_blank','noopener'); };
$('#detailVideo').addEventListener('click',()=>openVideo(selected));
// The big picture follows the pointer slightly.
$('#detailArt').addEventListener('pointermove',event=>{ const rect=event.currentTarget.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5; for(const image of event.currentTarget.querySelectorAll('img')) image.style.transform=`translate(${-x*2.4}%,${-y*2.4}%)`; });
$('#detailArt').addEventListener('pointerleave',event=>{ for(const image of event.currentTarget.querySelectorAll('img')) image.style.transform=''; });
guideImage.addEventListener('load',()=>updateImageState('ready'));
guideImage.addEventListener('error',()=>updateImageState('error'));
guideClose.addEventListener('click',closeGuide);
$('#closeImageError').addEventListener('click',closeGuide);
$('#retryImage').addEventListener('click',()=>showArtwork({retry:true}));
$('#searchVideo').addEventListener('click',()=>openVideo(activeViewer));
$('#viewerFavorite').addEventListener('click',()=>toggleFavorite(activeViewer));
viewerPrev.addEventListener('click',()=>stepViewer(-1));
viewerNext.addEventListener('click',()=>stepViewer(1));
guideModal.addEventListener('click',event=>{ if((event.target===guideStage||event.target.classList.contains('viewer-bg'))&&!dragMoved) closeGuide(); dragMoved=false; });
guideStage.addEventListener('dblclick',event=>{ if(!imageReady||event.target.closest('button')) return; event.preventDefault(); zoom>1.005?fitGuide():actualGuide(); });
guideStage.addEventListener('wheel',event=>{ if(!imageReady) return; event.preventDefault(); setZoom(zoom*(event.deltaY<0?1.14:.88)); },{passive:false});
$('#zoomOut').addEventListener('click',()=>setZoom(zoom*.78));
$('#zoomIn').addEventListener('click',()=>setZoom(zoom*1.28));
$('#zoomFit').addEventListener('click',fitGuide);
guideStage.addEventListener('pointerdown',event=>{
  if(!imageReady||event.target.closest('button')) return;
  guideStage.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY,lastX:event.clientX,lastY:event.clientY});
  if(zoom>1.005) guideStage.classList.add('dragging'); dragMoved=false;
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinchStartDistance=Math.hypot(a.x-b.x,a.y-b.y); pinchStartZoom=zoom; }
});
guideStage.addEventListener('pointermove',event=>{
  const pointer=pointers.get(event.pointerId); if(!pointer) return;
  pointer.x=event.clientX; pointer.y=event.clientY;
  if(pointers.size===2){
    const [a,b]=[...pointers.values()]; const distance=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchStartDistance) setZoom(pinchStartZoom*distance/pinchStartDistance); dragMoved=true;
  }else if(zoom>1.005){
    const dx=event.clientX-pointer.lastX,dy=event.clientY-pointer.lastY;
    if(Math.abs(dx)+Math.abs(dy)>1){ panX+=dx; panY+=dy; dragMoved=true; applyGuideTransform(); }
  }
  pointer.lastX=event.clientX; pointer.lastY=event.clientY;
});
function releasePointer(event){
  pointers.delete(event.pointerId);
  if(!pointers.size) guideStage.classList.remove('dragging');
  else if(pointers.size===1){ const p=[...pointers.values()][0]; p.lastX=p.x; p.lastY=p.y; }
}
guideStage.addEventListener('pointerup',releasePointer);
guideStage.addEventListener('pointercancel',releasePointer);
window.addEventListener('resize',()=>{ paintControls(); if(!guideModal.hidden) fitGuide(); });
document.addEventListener('keydown',event=>{
  const typing=event.target instanceof Element&&event.target.closest('input,select,textarea,dialog');
  if(guideModal.hidden){
    if(document.querySelector('dialog[open]')) return;
    if((event.key==='/'&&!typing)||(event.ctrlKey&&event.key.toLowerCase()==='f')){ event.preventDefault(); q.focus(); q.select(); }
    else if(event.key.toLowerCase()==='w'&&!typing&&!event.ctrlKey&&!event.altKey&&!event.metaKey) setWide(!wide);
    else if(event.key==='Escape'){ if(filterPanel.classList.contains('open')) toggleFilters(false); else if(document.activeElement===q&&q.value){ q.value=''; render(); } }
    return;
  }
  const key=event.key.toLowerCase();
  if(event.key==='Escape'){ event.preventDefault(); closeGuide(); }
  else if(event.key==='ArrowLeft'){ event.preventDefault(); stepViewer(-1); }
  else if(event.key==='ArrowRight'){ event.preventDefault(); stepViewer(1); }
  else if(event.key==='+'||event.key==='=') setZoom(zoom*1.28);
  else if(event.key==='-') setZoom(zoom*.78);
  else if(event.key==='0') fitGuide();
  else if(event.key==='1') actualGuide();
  else if(key==='f') toggleFavorite(activeViewer);
  else if(key==='p'){ const skin=activeViewer; if(isPlayable(skin)){ closeGuide(); playSkin(skin); } }
  else if(event.key==='Tab'){
    const buttons=[...guideModal.querySelectorAll('button')].filter(button=>!button.disabled&&!button.closest('[hidden]'));
    const first=buttons[0],last=buttons[buttons.length-1];
    if(event.shiftKey&&document.activeElement===first){ event.preventDefault(); last.focus(); }
    else if(!event.shiftKey&&document.activeElement===last){ event.preventDefault(); first.focus(); }
  }
});
// 鼠标停留时的名称提示：用和界面一致的样式，代替系统自带的提示条。
// 任何元素的 title 都会被接管（title 被移到 data-tip），所以别处照常写 title 即可。
(()=>{
  const tip=document.createElement('div'); tip.className='tip'; tip.setAttribute('role','tooltip'); document.body.append(tip);
  let target=null,timer=0;
  const adopt=node=>{ if(node.nodeType===1&&node.hasAttribute('title')){ const text=node.getAttribute('title'); node.removeAttribute('title'); if(text) node.dataset.tip=text; else delete node.dataset.tip; if(node===target) paint(); } };
  function paint(){
    const text=target?.dataset.tip; if(!text) return hide();
    // “收藏（F）” -> 文字 + 按键标记
    const key=/^(.*?)（([^（）]{1,12})）$/.exec(text);
    tip.replaceChildren(key?key[1]:text); if(key){ const kbd=document.createElement('kbd'); kbd.textContent=key[2]; tip.append(kbd); }
    const box=target.getBoundingClientRect(),width=tip.offsetWidth,height=tip.offsetHeight;
    // 第一次出现时直接到位，已经显示时才滑到下一个按钮。
    tip.style.transition=tip.classList.contains('show')?'':'opacity .16s ease';
    const place=((target,box,width,height)=>({x:box.left+box.width/2-width/2,y:box.top-height-9>=6?box.top-height-9:box.bottom+9}))(target,box,width,height);
    tip.style.transform=`translate(${Math.round(Math.max(8,Math.min(innerWidth-width-8,place.x)))}px,${Math.round(place.y)}px)`;
    tip.classList.add('show');
  }
  function hide(){ clearTimeout(timer); target=null; tip.classList.remove('show'); }
  function show(node,delay){ if(node===target) return; hide(); if(!node) return; target=node; timer=setTimeout(paint,delay); }
  document.addEventListener('pointerover',event=>{ const node=event.target instanceof Element?event.target.closest('[title],[data-tip]'):null; if(node) adopt(node); show(node,tip.classList.contains('show')?60:380); });
  document.addEventListener('focusin',event=>{ const node=event.target instanceof Element?event.target.closest('[title],[data-tip]'):null; if(node){ adopt(node); if(node.matches(':focus-visible')) show(node,380); } });
  document.addEventListener('focusout',hide); document.addEventListener('pointerdown',hide,true); document.addEventListener('keydown',hide,true);
  document.addEventListener('scroll',hide,true); window.addEventListener('blur',hide);
  document.documentElement.addEventListener('pointerleave',hide);
  new MutationObserver(records=>{ for(const record of records) adopt(record.target); }).observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['title']});
  for(const node of document.querySelectorAll('[title]')) adopt(node);
})();
// What the desktop shell (desktop/renderer.js) uses.
window.l2dGallery={
  icon,
  // Reloads card images that finished downloading after the page opened.
  retryFailedImages(){ for(const card of grid.querySelectorAll('.card.image-failed')){ const img=card.querySelector('.thumb'); const src=img.getAttribute('src'); img.removeAttribute('src'); img.src=src; } },
  // ids saved in .desktop-data, and save(id,on) resolving to the saved ids.
  enableFavorites(ids,save){
    favorites=new Set(Array.isArray(ids)?ids:[]); saveFavorite=save;
    $('#favoritesOnly').hidden=false;
    if(restoreFavoritesOnly){ state.favoritesOnly=true; state.filter='all'; } restoreFavoritesOnly=false;
    render({keepScroll:true,animate:false}); paintDetail(false);
  },
  // Favorites changed somewhere else (the tryout): repaint the stars.
  setFavorites(ids){ if(!favorites) return; favorites=new Set(Array.isArray(ids)?ids:[]); refreshFavorites(); },
  // playable: Map of skin id -> sample; pending: Map of skin id -> {status, reason}; open(id) starts the tryout.
  enableTryout(options){
    tryout={playable:options.playable,pending:options.pending||new Map(),open:options.open};
    if(!$('#viewerPlay')){
      const play=element('button','primary'); play.type='button'; play.id='viewerPlay'; play.innerHTML=icon('play')+'进入试玩'; play.title='进入试玩（P）';
      play.addEventListener('click',()=>{ const skin=activeViewer; closeGuide(); playSkin(skin); });
      const gap=element('span','sep'); gap.id='viewerPlayGap'; $('#viewerActions').append(play,gap);
    }
    paintViewerPlay();
    render({keepScroll:true,animate:false}); paintDetail(false);
  },
  // Used by the self-test: back to the default view, whatever the last session left.
  resetView(){ try{ localStorage.removeItem(STORE_KEY); }catch{} wide=false; grid.classList.remove('intro'); resetFilters(); },
  viewer:{ close:closeGuide, get skin(){ return guideModal.hidden?null:activeViewer; } },
  get selected(){ return selected; }
};
try{
  const data=validateData(window.L2D_SKINS_DATA);
  skins=data.skins; skinById=new Map(skins.map(skin=>[skin.id,skin]));
  updatePageMeta(data);
  selected=skinById.get(saved.selected)||null;
  render({animate:false});
  if(Number.isFinite(saved.scroll)) grid.scrollTop=saved.scroll;
  setTimeout(()=>grid.classList.remove('intro'),1600);
  document.fonts?.ready.then(paintControls);
}catch(error){ showDataError(error); }
