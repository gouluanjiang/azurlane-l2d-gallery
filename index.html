<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>碧蓝航线 L2D 玩法合集</title>
  <style>
    :root { color-scheme:dark; --bg:#07111f; --panel:#101d31; --panel-2:#14243b; --line:#263c5f; --blue:#68b5ff; --cyan:#62e4ef; --muted:#9eb2cf; --red:#ff7f9b; --green:#64dda0; --amber:#ffc66d; --purple:#bd9cff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; background:radial-gradient(circle at 50% -10%,#173357 0,#0b1829 30%,var(--bg) 65%); color:#eef6ff; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
    main { width:min(1680px,96vw); margin:auto; padding:22px 0 56px; }
    .site-header { display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 16px; margin-bottom:14px; }
    h1 { margin:0; font-size:26px; letter-spacing:.02em; }
    .subtitle { margin:0; color:var(--muted); font-size:14px; }
    [hidden] { display:none!important; }
    .data-error { margin:18px 0; padding:20px; border:1px solid var(--red); border-radius:14px; background:#331c2c; line-height:1.7; }
    .data-error strong { color:#ffb0c2; }
    .data-error p { margin:6px 0 12px; }
    .toolbar-shell { position:sticky; top:0; z-index:50; margin:0 -10px 14px; padding:10px; border-radius:0 0 14px 14px; background:rgba(7,17,31,.88); backdrop-filter:blur(16px) saturate(135%); box-shadow:0 12px 30px rgba(0,0,0,.18); }
    .toolbar { display:flex; gap:9px; align-items:center; }
    .search-wrap { position:relative; flex:1 1 360px; min-width:220px; }
    input,select,button { font:inherit; }
    input,select { width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:11px; outline:none; background:#0b182a; color:#fff; }
    input { padding-right:42px; }
    input:focus,select:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(104,181,255,.15); }
    select { width:auto; min-width:170px; cursor:pointer; }
    button { padding:8px 13px; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:#edf6ff; cursor:pointer; transition:border-color .18s ease,background .18s ease,color .18s ease; }
    button:hover { border-color:#527ab1; }
    button:focus-visible,a:focus-visible { outline:3px solid rgba(104,181,255,.65); outline-offset:2px; }
    button.active { border-color:#70baff; background:#1d66ad; color:#fff; }
    .clear-search { position:absolute; top:50%; right:7px; width:30px; height:30px; padding:0; border:0; border-radius:50%; transform:translateY(-50%); background:transparent; color:var(--muted); font-size:21px; }
    .clear-search:hover { background:#172a45; color:#fff; }
    .filter-row { display:flex; gap:7px; margin-top:8px; overflow-x:auto; scrollbar-width:thin; }
    .filter-row button { flex:0 0 auto; white-space:nowrap; padding:6px 12px; font-size:14px; }
    .filter-row button small { margin-left:5px; color:inherit; opacity:.7; }
    .type-row,.favorite-row { display:flex; gap:7px; padding-left:12px; border-left:1px solid var(--line); }
    .favorite-row[hidden] { display:none; }
    .year-row { display:flex; gap:7px; margin-left:auto; padding-left:12px; border-left:1px solid var(--line); }
    .results-bar { margin:0 2px 12px; color:var(--muted); font-size:13px; }
    .results-bar strong { color:#eaf4ff; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; }
    .card { position:relative; aspect-ratio:2/3; min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#0b1626; box-shadow:0 10px 26px rgba(0,0,0,.22); content-visibility:auto; contain-intrinsic-size:auto 300px; transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease; }
    .card:hover { transform:translateY(-3px); border-color:#5b86ba; box-shadow:0 18px 40px rgba(0,0,0,.36); }
    .media-trigger { position:absolute; inset:0; display:block; width:100%; height:100%; padding:0; border:0; border-radius:0; background:transparent; color:inherit; cursor:zoom-in; }
    .media-trigger:focus-visible { outline:3px solid var(--blue); outline-offset:-3px; }
    .thumb { display:block; width:100%; height:100%; object-fit:cover; object-position:center top; transition:transform .3s ease; }
    .card:hover .thumb { transform:scale(1.03); }
    .fallback { position:absolute; inset:0; display:none; place-items:center; padding:24px; text-align:center; color:var(--muted); font-size:13px; line-height:1.7; background:linear-gradient(160deg,#13253d,#0a1524); }
    .card.image-failed .fallback { display:grid; }
    .card.image-failed .thumb { visibility:hidden; }
    .badges { position:absolute; top:8px; left:8px; right:8px; display:flex; gap:6px; pointer-events:none; }
    .badge { padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; line-height:1.6; backdrop-filter:blur(6px); }
    .badge-new { background:#ff6f91e6; color:#fff; }
    .badge-guide { margin-left:auto; background:#11392ae0; color:#8ff0b9; border:1px solid rgba(100,221,160,.5); font-weight:400; }
    .info { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:flex-end; gap:8px; padding:46px 11px 10px; background:linear-gradient(180deg,transparent,rgba(5,11,21,.78) 42%,rgba(5,11,21,.95)); pointer-events:none; }
    .info-text { min-width:0; flex:1; }
    .name { overflow:hidden; color:#fff; font-size:16px; font-weight:800; line-height:1.35; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 3px #000a; }
    .skin { overflow:hidden; margin-top:1px; color:#d8e8ff; font-size:13px; line-height:1.45; text-overflow:ellipsis; white-space:nowrap; }
    .meta { display:flex; align-items:center; gap:4px; min-height:24px; margin-top:3px; color:#9fb4cf; font-size:12px; white-space:nowrap; }
    .meta .type-l2d-plus { color:#d2baff; }
    .meta .type-dual { color:#ffd792; }
    .info button { pointer-events:auto; }
    .card-favorite { flex:none; width:30px; height:30px; padding:0; border:1px solid rgba(255,255,255,.28); border-radius:50%; background:rgba(5,11,21,.55); color:#e6eefa; font-size:17px; line-height:1; cursor:pointer; }
    .card-favorite:hover { border-color:#ffd36b; color:#ffd36b; }
    .card-favorite[aria-pressed="true"] { border-color:#ffd36b; background:rgba(92,66,8,.8); color:#ffd36b; }
    .empty-state { display:none; padding:48px 20px; border:1px dashed var(--line); border-radius:18px; text-align:center; color:var(--muted); background:rgba(12,25,43,.65); }
    .empty-state.visible { display:block; }
    .empty-state button { margin-top:14px; }
    body.guide-open { overflow:hidden; }
    .guide-modal { position:fixed; inset:0; z-index:1000; display:grid; grid-template-rows:auto 1fr auto; padding:10px 12px; background:rgba(0,4,11,.95); backdrop-filter:blur(9px); }
    .viewer-head { display:flex; align-items:center; gap:14px; min-height:44px; padding:0 64px 6px 6px; }
    .viewer-caption { min-width:0; overflow:hidden; font-size:18px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
    .viewer-caption small { margin-left:10px; color:var(--muted); font-size:13px; font-weight:400; }
    .viewer-counter { margin-left:auto; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .guide-stage { position:relative; min-width:0; min-height:0; overflow:hidden; border-radius:12px; cursor:grab; touch-action:none; }
    .guide-stage.dragging { cursor:grabbing; }
    .guide-stage img { position:absolute; left:50%; top:50%; display:block; max-width:none; max-height:none; transform-origin:center; user-select:none; -webkit-user-drag:none; will-change:transform; box-shadow:0 22px 70px rgba(0,0,0,.7); }
    .viewer-nav { position:absolute; z-index:3; top:50%; width:52px; height:84px; padding:0; border:1px solid rgba(255,255,255,.18); border-radius:14px; transform:translateY(-50%); background:rgba(5,10,18,.6); color:#fff; font-size:34px; line-height:1; }
    .viewer-nav:hover { background:rgba(29,102,173,.85); }
    .viewer-nav:disabled { opacity:.25; cursor:default; }
    #viewerPrev { left:10px; } #viewerNext { right:10px; }
    .guide-close { position:fixed; z-index:1002; top:12px; right:16px; width:42px; height:42px; padding:0; border:1px solid rgba(255,255,255,.55); border-radius:50%; background:rgba(5,10,18,.88); color:#fff; font-size:28px; line-height:1; }
    .guide-tools { z-index:1001; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:7px; padding:9px; }
    .viewer-actions { display:contents; }
    .guide-message { position:absolute; z-index:2; inset:0; display:grid; place-content:center; gap:12px; padding:24px; text-align:center; color:#dbe9ff; cursor:default; touch-action:auto; }
    .guide-message p { margin:0; line-height:1.7; }
    .guide-message-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; }
    .guide-tools button:disabled { opacity:.45; cursor:default; }
    .guide-tools button { min-width:42px; background:rgba(12,25,43,.94); }
    .guide-tools .viewer-accent { border-color:rgba(100,221,160,.62); background:#173d2d; color:#baffd6; }
    .guide-tools .tool-gap { width:14px; }
    .zoom-label { min-width:60px; color:#dcecff; text-align:center; font-variant-numeric:tabular-nums; }
    footer { margin-top:30px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; line-height:1.7; }
    @media(max-width:980px){ .toolbar{flex-wrap:wrap}.search-wrap{flex-basis:100%}select{flex:1}.year-row{margin-left:0;padding-left:0;border-left:0} }
    @media(max-width:700px){ main{width:94vw;padding-top:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.guide-modal{padding:4px}.viewer-nav{width:40px;height:64px} }
    @media(prefers-reduced-motion:reduce){ *,*::before,*::after{transition:none!important} }
  </style>
</head>
<body>
<main>
  <header class="site-header">
    <h1>碧蓝航线 L2D 图鉴</h1>
    <p class="subtitle" id="summary">正在读取本地数据…</p>
  </header>
  <div id="dataError" class="data-error" role="alert" hidden><strong>本地数据无法读取</strong><p id="dataErrorDetail"></p><button id="reloadData" type="button">重新加载页面</button></div>
  <noscript><div class="data-error">请启用浏览器 JavaScript，再重新打开本页以加载本地图鉴。</div></noscript>

  <section class="toolbar-shell" aria-label="皮肤筛选工具">
    <div class="toolbar">
      <div class="search-wrap">
        <input id="search" type="search" autocomplete="off" placeholder="搜索角色名或皮肤名…" aria-label="搜索角色名或皮肤名">
        <button id="clearSearch" class="clear-search" type="button" aria-label="清空搜索" hidden>×</button>
      </div>
      <select id="sortOrder" aria-label="皮肤排序方式">
        <option value="date-desc">实装时间：从新到旧</option>
        <option value="date-asc">实装时间：从早到晚</option>
        <option value="name">角色名排序</option>
      </select>
    </div>
    <div class="filter-row">
      <button class="active" type="button" data-filter="all">全部<small id="countAll"></small></button>
      <button type="button" data-filter="new">新上线<small id="countNew"></small></button>
      <button type="button" data-filter="ready">有玩法图解<small id="countReady"></small></button>
      <div class="type-row" role="group" aria-label="按类型筛选">
        <button type="button" data-type="L2D" aria-pressed="false">L2D<small data-type-count="L2D"></small></button>
        <button type="button" data-type="L2D+" aria-pressed="false">L2D+<small data-type-count="L2D+"></small></button>
        <button type="button" data-type="双形态" aria-pressed="false">双形态<small data-type-count="双形态"></small></button>
      </div>
      <div id="favoriteFilter" class="favorite-row" hidden>
        <button id="favoritesOnly" type="button" aria-pressed="false">★ 只看收藏<small id="countFavorites"></small></button>
      </div>
      <div id="yearFilters" class="year-row" aria-label="按年份筛选">
        <button class="active" type="button" data-year="all">全部年份</button>
      </div>
    </div>
  </section>

  <div class="results-bar" aria-live="polite"><span id="resultCount">正在读取本地数据…</span></div>
  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty-state">
    没有找到符合当前条件的皮肤。
    <br><button id="resetFilters" type="button">清空搜索与筛选</button>
  </div>

  <div id="guideModal" class="guide-modal" role="dialog" aria-modal="true" aria-label="图片查看器" hidden>
    <div class="viewer-head"><div id="viewerCaption" class="viewer-caption"></div><span id="viewerCounter" class="viewer-counter"></span></div>
    <button id="guideClose" class="guide-close" type="button" aria-label="关闭图片查看器">×</button>
    <div id="guideStage" class="guide-stage">
      <img id="guideImage" alt="" draggable="false">
      <button id="viewerPrev" class="viewer-nav" type="button" aria-label="上一款（←）">‹</button>
      <button id="viewerNext" class="viewer-nav" type="button" aria-label="下一款（→）">›</button>
      <div id="guideMessage" class="guide-message" role="status" hidden>
        <p id="guideMessageText"></p>
        <div id="guideRecovery" class="guide-message-actions" hidden>
          <button id="retryImage" type="button">重试加载</button>
          <button id="fallbackArtwork" type="button" hidden>查看皮肤原图</button>
          <button id="closeImageError" type="button">关闭查看器</button>
        </div>
      </div>
    </div>
    <div class="guide-tools" aria-label="图片查看工具">
      <span id="viewerActions" class="viewer-actions"></span>
      <button id="viewGuideFromArtwork" class="viewer-accent" type="button" hidden>查看玩法图解</button>
      <button id="viewArtworkFromGuide" type="button" hidden>返回原图</button>
      <button id="searchVideo" type="button" hidden>搜索玩法视频 ↗</button>
      <span class="tool-gap"></span>
      <button id="zoomOut" type="button" aria-label="缩小图片">−</button>
      <button id="zoomFit" type="button">适应窗口</button>
      <span id="zoomLabel" class="zoom-label">适应</span>
      <button id="zoomActual" type="button">100%</button>
      <button id="zoomIn" type="button" aria-label="放大图片">＋</button>
    </div>
  </div>

  <footer>原图来自碧蓝航线 WIKI，玩法图解来自玩家整理。点卡片查看原图，在查看器里用 ← → 翻看。</footer>
</main>
<script src="data/skins-data.js"></script>
<script>
'use strict';
const grid=document.querySelector('#grid');
const q=document.querySelector('#search');
const sortOrder=document.querySelector('#sortOrder');
const clearSearch=document.querySelector('#clearSearch');
const emptyState=document.querySelector('#emptyState');
const resultCount=document.querySelector('#resultCount');
const guideModal=document.querySelector('#guideModal');
const guideStage=document.querySelector('#guideStage');
const guideImage=document.querySelector('#guideImage');
const guideClose=document.querySelector('#guideClose');
const viewGuideFromArtwork=document.querySelector('#viewGuideFromArtwork');
const viewArtworkFromGuide=document.querySelector('#viewArtworkFromGuide');
const searchVideo=document.querySelector('#searchVideo');
const viewerCaption=document.querySelector('#viewerCaption');
const viewerCounter=document.querySelector('#viewerCounter');
const viewerPrev=document.querySelector('#viewerPrev');
const viewerNext=document.querySelector('#viewerNext');
const guideMessage=document.querySelector('#guideMessage');
const guideMessageText=document.querySelector('#guideMessageText');
const guideRecovery=document.querySelector('#guideRecovery');
const fallbackArtwork=document.querySelector('#fallbackArtwork');
const zoomLabel=document.querySelector('#zoomLabel');
const zoomButtons=['zoomOut','zoomIn','zoomFit','zoomActual'].map(id=>document.getElementById(id));
const state={filter:'all',year:'all',type:'all',favoritesOnly:false,sort:'date-desc'};
// Favorites exist only in the desktop app, which stores them in .desktop-data and calls
// window.l2dGallery.enableFavorites(). Opened directly in a browser the feature stays hidden.
let favorites=null,saveFavorite=null;
const isFavorite=skin=>Boolean(favorites&&favorites.has(skin.id));
// Skins released within this many days count as "新上线".
const NEW_DAYS=60;
let skins=[],skinById=new Map(),currentView=[],newSince='';
let guideReturnFocus=null,viewerMode='artwork',activeViewer=null,imageReady=false;
let zoom=1,fitZoom=1,panX=0,panY=0,dragMoved=false;
let pinchStartDistance=0,pinchStartZoom=1;
const pointers=new Map();
const searchUrl=(c,s)=>`https://search.bilibili.com/all?keyword=${encodeURIComponent('碧蓝航线 '+c+' '+s+' L2D 彩蛋 教程')}`;
const hasLocalGuide=skin=>Boolean(skin.guidePath);
const isNew=skin=>skin.releaseDate>=newSince;
const typeClass=type=>type==='L2D+'?'type-l2d-plus':type==='双形态'?'type-dual':'type-l2d';
function element(tag,className,text){
  const node=document.createElement(tag);
  if(className) node.className=className;
  if(text!==undefined) node.textContent=text;
  return node;
}
function isDate(value){
  if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const parsed=new Date(value+'T00:00:00Z');
  return Number.isFinite(parsed.getTime())&&parsed.toISOString().slice(0,10)===value;
}
function isLocalImagePath(value,folder){
  if(typeof value!=='string'||!value.startsWith(`assets/${folder}/`)||/[\\:?#\u0000-\u001f\u007f]/.test(value)) return false;
  return value.split('/').every(part=>part&&part!=='.'&&part!=='..'&&!part.includes('%'));
}
function validateData(data){
  if(!data||typeof data!=='object'||Array.isArray(data)) throw new Error('未找到 data/skins-data.js，请保留完整目录；桌面版可点“检查更新”恢复数据后重试。');
  if(data.schemaVersion!==2) throw new Error('数据格式版本不匹配，请在桌面版点“检查更新”同步与本页配套的数据。');
  if(typeof data.version!=='string'||!data.version.trim()||!isDate(data.updatedTo)) throw new Error('数据版本或更新日期无效，请重新同步数据。');
  if(data.checkedAt!==null&&data.checkedAt!==undefined&&(typeof data.checkedAt!=='string'||!Number.isFinite(Date.parse(data.checkedAt)))) throw new Error('上次检查时间格式无效，请重新同步数据。');
  if(!Array.isArray(data.skins)||!data.skins.length) throw new Error('皮肤数据为空或格式错误，请重新同步数据。');
  const ids=new Set();
  data.skins.forEach((skin,index)=>{
    const label=`第 ${index+1} 条皮肤数据`;
    if(!skin||typeof skin!=='object'||Array.isArray(skin)) throw new Error(label+'格式错误。');
    for(const field of ['id','character','name','variant','type']){
      if(typeof skin[field]!=='string'||!skin[field].trim()) throw new Error(label+'缺少有效的 '+field+' 字段。');
    }
    if(ids.has(skin.id)) throw new Error(label+'的稳定标识重复，请重新同步数据。');
    ids.add(skin.id);
    if(!['L2D','L2D+','双形态'].includes(skin.type)||!isDate(skin.releaseDate)) throw new Error(label+'的类型或实装日期无效。');
    if(!isLocalImagePath(skin.artworkPath,'skins')||(skin.guidePath!==null&&!isLocalImagePath(skin.guidePath,'guides'))) throw new Error(label+'的本地图片路径无效，请重新同步数据。');
  });
  return data;
}
function showDataError(error){
  document.querySelector('#dataError').hidden=false;
  document.querySelector('#dataErrorDetail').textContent=error.message||'数据无法加载，请重新同步后重试。';
  document.querySelector('#summary').textContent='本地数据不可用';
  document.querySelectorAll('.toolbar-shell,.results-bar').forEach(node=>node.hidden=true);
  grid.hidden=true;
  emptyState.classList.remove('visible');
}
function updatePageMeta(data){
  const dates=skins.map(skin=>skin.releaseDate).sort();
  document.title=`碧蓝航线 L2D 图鉴（更新至 ${data.updatedTo}）`;
  newSince=new Date(Date.now()-NEW_DAYS*864e5).toISOString().slice(0,10);
  document.querySelector('#summary').textContent=`共 ${skins.length} 款 · ${dates[0]} 至 ${dates[dates.length-1]} · 资料更新至 ${data.updatedTo}`;
  const newCount=skins.filter(isNew).length;
  document.querySelector('#countAll').textContent=skins.length;
  document.querySelector('#countNew').textContent=newCount;
  document.querySelector('#countReady').textContent=skins.filter(hasLocalGuide).length;
  for(const node of document.querySelectorAll('[data-type-count]')){
    const count=skins.filter(skin=>skin.type===node.dataset.typeCount).length;
    node.textContent=count; node.closest('button').hidden=!count;
  }
  updateFavoriteCount();
  document.querySelector('[data-filter="new"]').hidden=!newCount;
  const yearFilters=document.querySelector('#yearFilters');
  yearFilters.replaceChildren();
  for(const year of ['all',...[...new Set(dates.map(date=>date.slice(0,4)))].reverse()]){
    const button=element('button',year==='all'?'active':'',year==='all'?'全部年份':year);
    button.type='button'; button.dataset.year=year; yearFilters.appendChild(button);
  }
}
function updateFavoriteCount(){
  document.querySelector('#countFavorites').textContent=favorites?skins.filter(isFavorite).length:'';
}
function sortedView(){
  const term=q.value.trim().toLocaleLowerCase('zh-CN');
  const view=skins.filter(skin=>{
    const matchesFilter=state.filter==='all'||(state.filter==='new'&&isNew(skin))||(state.filter==='ready'&&hasLocalGuide(skin));
    const matchesYear=state.year==='all'||skin.releaseDate.startsWith(state.year+'-');
    const matchesType=state.type==='all'||skin.type===state.type;
    const matchesFavorite=!state.favoritesOnly||isFavorite(skin);
    const haystack=(skin.character+' '+skin.name).toLocaleLowerCase('zh-CN');
    return matchesFilter&&matchesYear&&matchesType&&matchesFavorite&&haystack.includes(term);
  });
  return view.sort((a,b)=>{
    if(state.sort==='date-desc') return b.releaseDate.localeCompare(a.releaseDate)||a.character.localeCompare(b.character,'zh-CN');
    if(state.sort==='name') return a.character.localeCompare(b.character,'zh-CN')||a.releaseDate.localeCompare(b.releaseDate);
    return a.releaseDate.localeCompare(b.releaseDate)||a.character.localeCompare(b.character,'zh-CN');
  });
}
function createCard(skin){
  const card=element('article','card'); card.dataset.skinId=skin.id;
  const label=`${skin.character}「${skin.name}」`;
  const media=element('button','media-trigger');
  media.type='button'; media.dataset.openArtwork=''; media.dataset.skinId=skin.id;
  media.setAttribute('aria-label',`查看${label}皮肤原图`);
  const image=element('img','thumb');
  image.alt=''; image.loading='lazy'; image.decoding='async';
  image.addEventListener('error',()=>card.classList.add('image-failed'));
  image.addEventListener('load',()=>card.classList.remove('image-failed'));
  image.src=skin.artworkPath;
  const fallback=element('div','fallback','原图暂未下载到本机');
  media.append(image,fallback);
  const badges=element('div','badges');
  if(isNew(skin)) badges.append(element('span','badge badge-new','新'));
  if(hasLocalGuide(skin)) badges.append(element('span','badge badge-guide','图解'));
  const info=element('div','info'),text=element('div','info-text');
  const name=element('div','name',skin.character); name.title=skin.character;
  const title=element('div','skin',skin.name); title.title=skin.name;
  const meta=element('div','meta');
  meta.append(element('span',typeClass(skin.type),skin.type),` · ${skin.releaseDate}`);
  text.append(name,title,meta); info.append(text);
  if(favorites) info.append(favoriteButton(skin,label));
  card.append(media,badges,info);
  return card;
}
function favoriteButton(skin,label){
  const button=element('button','card-favorite');
  button.type='button'; button.dataset.favorite=skin.id;
  const paint=()=>{
    const on=isFavorite(skin);
    button.textContent=on?'★':'☆'; button.setAttribute('aria-pressed',String(on));
    button.setAttribute('aria-label',(on?'取消收藏':'收藏')+label); button.title=on?'取消收藏':'收藏';
  };
  paint();
  button.addEventListener('click',()=>{
    const on=!isFavorite(skin);
    if(on) favorites.add(skin.id); else favorites.delete(skin.id);
    paint(); updateFavoriteCount();
    Promise.resolve(saveFavorite?.(skin.id,on)).then(saved=>{
      if(Array.isArray(saved)) favorites=new Set(saved);
      paint(); updateFavoriteCount();
      if(state.favoritesOnly) render();
    }).catch(()=>{
      if(on) favorites.delete(skin.id); else favorites.add(skin.id);
      paint(); updateFavoriteCount();
      button.title='收藏未能保存，请重试';
    });
  });
  return button;
}
function render(){
  currentView=sortedView();
  grid.replaceChildren(...currentView.map(createCard));
  resultCount.replaceChildren('显示 ',element('strong','',currentView.length),` / ${skins.length} 款`);
  emptyState.classList.toggle('visible',currentView.length===0);
  grid.hidden=currentView.length===0; clearSearch.hidden=!q.value;
}
function resetFilters(){
  state.filter='all'; state.year='all'; state.type='all'; state.favoritesOnly=false; state.sort='date-desc'; q.value=''; sortOrder.value=state.sort;
  document.querySelectorAll('[data-type],#favoritesOnly').forEach(button=>{ button.classList.remove('active'); button.setAttribute('aria-pressed','false'); });
  document.querySelectorAll('[data-filter]').forEach(button=>button.classList.toggle('active',button.dataset.filter==='all'));
  document.querySelectorAll('[data-year]').forEach(button=>button.classList.toggle('active',button.dataset.year==='all'));
  render();
}
function applyGuideTransform(){
  guideImage.style.transform=`translate(calc(-50% + ${panX}px),calc(-50% + ${panY}px)) scale(${zoom})`;
  zoomLabel.textContent=Math.abs(zoom-fitZoom)<.005?'适应':`${Math.round(zoom*100)}%`;
}
function computeFitZoom(){
  if(!imageReady||!guideImage.naturalWidth||!guideStage.clientWidth) return;
  guideImage.style.width=guideImage.naturalWidth+'px'; guideImage.style.height=guideImage.naturalHeight+'px';
  fitZoom=Math.min(Math.max(1,guideStage.clientWidth-24)/guideImage.naturalWidth,Math.max(1,guideStage.clientHeight-24)/guideImage.naturalHeight,1);
}
function setZoom(next,{resetPan=false}={}){
  if(!imageReady) return;
  computeFitZoom(); zoom=Math.max(fitZoom,Math.min(4,next));
  if(resetPan){ panX=0; panY=0; }
  applyGuideTransform();
}
function fitGuide(){ computeFitZoom(); setZoom(fitZoom,{resetPan:true}); }
function actualGuide(){ setZoom(1,{resetPan:true}); }
function updateImageState(status){
  imageReady=status==='ready'; guideImage.hidden=!imageReady;
  guideMessage.hidden=imageReady; guideRecovery.hidden=status!=='error';
  zoomButtons.forEach(button=>button.disabled=!imageReady);
  fallbackArtwork.hidden=viewerMode!=='guide';
  if(status==='loading'){ guideMessageText.textContent='正在读取本地图片…'; zoomLabel.textContent='加载中'; }
  if(status==='error'){
    guideMessageText.textContent='这张图片还没有下载到本机，或文件已损坏。可以重试，或同步后再看。';
    zoomLabel.textContent='加载失败';
  }
}
function updateViewerChrome(){
  const index=currentView.indexOf(activeViewer);
  viewerCaption.replaceChildren(`${activeViewer.character}「${activeViewer.name}」`,element('small','',`${activeViewer.type} · ${activeViewer.releaseDate}${viewerMode==='guide'?' · 玩法图解':''}`));
  viewerCounter.textContent=index>=0?`${index+1} / ${currentView.length}`:'';
  viewerPrev.disabled=index<=0; viewerNext.disabled=index<0||index>=currentView.length-1;
  viewGuideFromArtwork.hidden=viewerMode!=='artwork'||!activeViewer.guidePath;
  viewArtworkFromGuide.hidden=viewerMode!=='guide';
  searchVideo.hidden=Boolean(activeViewer.guidePath);
  for(const neighbour of [currentView[index-1],currentView[index+1]]) if(neighbour) new Image().src=neighbour.artworkPath;
  guideModal.dataset.skinId=activeViewer.id;
  guideModal.dispatchEvent(new CustomEvent('viewer-change',{detail:{skinId:activeViewer.id,mode:viewerMode}}));
}
function setViewerMode(mode,{retry=false}={}){
  if(!activeViewer) return;
  viewerMode=mode;
  const isArtwork=mode==='artwork',source=isArtwork?activeViewer.artworkPath:activeViewer.guidePath;
  if(!source) return;
  const label=`${activeViewer.character}「${activeViewer.name}」${isArtwork?'皮肤原图':'玩法图解'}`;
  guideModal.setAttribute('aria-label',label); guideImage.alt=label;
  updateViewerChrome();
  pointers.clear(); guideStage.classList.remove('dragging'); panX=0; panY=0; dragMoved=false;
  updateImageState('loading');
  if(retry) guideImage.removeAttribute('src');
  if(guideImage.getAttribute('src')!==source) guideImage.src=source;
  if(guideImage.complete){
    if(guideImage.naturalWidth){ updateImageState('ready'); requestAnimationFrame(fitGuide); }
    else updateImageState('error');
  }
}
function openViewer(trigger,mode){
  activeViewer=skinById.get(trigger.dataset.skinId);
  if(!activeViewer||(mode==='guide'&&!activeViewer.guidePath)) return;
  if(guideModal.hidden) guideReturnFocus=trigger||document.activeElement;
  guideModal.hidden=false; document.body.classList.add('guide-open');
  setViewerMode(mode); guideClose.focus();
}
function stepViewer(delta){
  const index=currentView.indexOf(activeViewer),next=currentView[index+delta];
  if(index<0||!next) return;
  activeViewer=next; guideReturnFocus=grid.querySelector(`[data-open-artwork][data-skin-id="${next.id}"]`)||guideReturnFocus;
  setViewerMode('artwork');
}
function closeGuide(){
  guideModal.hidden=true; document.body.classList.remove('guide-open'); pointers.clear(); guideStage.classList.remove('dragging');
  if(guideReturnFocus&&guideReturnFocus.isConnected){ guideReturnFocus.focus({preventScroll:true}); guideReturnFocus.closest('.card')?.scrollIntoView({block:'nearest'}); }
}
grid.addEventListener('click',event=>{
  const artwork=event.target.closest('[data-open-artwork]');
  if(artwork) openViewer(artwork,'artwork');
});
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{
  state.filter=button.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(node=>node.classList.toggle('active',node===button)); render();
}));
document.querySelector('#yearFilters').addEventListener('click',event=>{
  const button=event.target.closest('[data-year]'); if(!button) return;
  state.year=button.dataset.year;
  document.querySelectorAll('[data-year]').forEach(node=>node.classList.toggle('active',node===button)); render();
});
// Type: one at a time; clicking the selected type again shows every type.
document.querySelectorAll('[data-type]').forEach(button=>button.addEventListener('click',()=>{
  state.type=state.type===button.dataset.type?'all':button.dataset.type;
  document.querySelectorAll('[data-type]').forEach(node=>{ const on=node.dataset.type===state.type; node.classList.toggle('active',on); node.setAttribute('aria-pressed',String(on)); });
  render();
}));
document.querySelector('#favoritesOnly').addEventListener('click',event=>{
  state.favoritesOnly=!state.favoritesOnly;
  event.currentTarget.classList.toggle('active',state.favoritesOnly); event.currentTarget.setAttribute('aria-pressed',String(state.favoritesOnly));
  render();
});
q.addEventListener('input',render);
clearSearch.addEventListener('click',()=>{ q.value=''; q.focus(); render(); });
sortOrder.addEventListener('change',()=>{ state.sort=sortOrder.value; render(); });
document.querySelector('#resetFilters').addEventListener('click',resetFilters);
document.querySelector('#reloadData').addEventListener('click',()=>window.location.reload());
guideImage.addEventListener('load',()=>{ updateImageState('ready'); fitGuide(); });
guideImage.addEventListener('error',()=>updateImageState('error'));
guideClose.addEventListener('click',closeGuide);
document.querySelector('#closeImageError').addEventListener('click',closeGuide);
document.querySelector('#retryImage').addEventListener('click',()=>setViewerMode(viewerMode,{retry:true}));
fallbackArtwork.addEventListener('click',()=>setViewerMode('artwork'));
viewGuideFromArtwork.addEventListener('click',()=>setViewerMode('guide'));
viewArtworkFromGuide.addEventListener('click',()=>setViewerMode('artwork'));
searchVideo.addEventListener('click',()=>{ if(activeViewer) window.open(searchUrl(activeViewer.character,activeViewer.name),'_blank','noopener'); });
viewerPrev.addEventListener('click',()=>stepViewer(-1));
viewerNext.addEventListener('click',()=>stepViewer(1));
guideStage.addEventListener('click',event=>{ if(event.target===guideStage&&!dragMoved) closeGuide(); dragMoved=false; });
guideStage.addEventListener('dblclick',event=>{ if(!imageReady||event.target.closest('button')) return; event.preventDefault(); Math.abs(zoom-fitZoom)<.01?actualGuide():fitGuide(); });
guideStage.addEventListener('wheel',event=>{ if(!imageReady) return; event.preventDefault(); setZoom(zoom*(event.deltaY<0?1.14:.88)); },{passive:false});
document.querySelector('#zoomOut').addEventListener('click',()=>setZoom(zoom*.82));
document.querySelector('#zoomIn').addEventListener('click',()=>setZoom(zoom*1.22));
document.querySelector('#zoomFit').addEventListener('click',fitGuide);
document.querySelector('#zoomActual').addEventListener('click',actualGuide);
guideStage.addEventListener('pointerdown',event=>{
  if(!imageReady||event.target.closest('button')) return;
  guideStage.setPointerCapture(event.pointerId);
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY,lastX:event.clientX,lastY:event.clientY});
  guideStage.classList.add('dragging'); dragMoved=false;
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinchStartDistance=Math.hypot(a.x-b.x,a.y-b.y); pinchStartZoom=zoom; }
});
guideStage.addEventListener('pointermove',event=>{
  const pointer=pointers.get(event.pointerId); if(!pointer) return;
  pointer.x=event.clientX; pointer.y=event.clientY;
  if(pointers.size===2){
    const [a,b]=[...pointers.values()]; const distance=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchStartDistance) setZoom(pinchStartZoom*distance/pinchStartDistance); dragMoved=true;
  }else if(zoom>fitZoom+.005){
    const dx=event.clientX-pointer.lastX,dy=event.clientY-pointer.lastY;
    if(Math.abs(dx)+Math.abs(dy)>1){ panX+=dx; panY+=dy; dragMoved=true; applyGuideTransform(); }
  }
  pointer.lastX=event.clientX; pointer.lastY=event.clientY;
});
function releasePointer(event){
  pointers.delete(event.pointerId);
  if(!pointers.size) guideStage.classList.remove('dragging');
  else if(pointers.size===1){ const p=[...pointers.values()][0]; p.lastX=p.x; p.lastY=p.y; }
}
guideStage.addEventListener('pointerup',releasePointer);
guideStage.addEventListener('pointercancel',releasePointer);
window.addEventListener('resize',()=>{ if(!guideModal.hidden) fitGuide(); });
document.addEventListener('keydown',event=>{
  if(guideModal.hidden) return;
  if(event.key==='Escape'){ event.preventDefault(); closeGuide(); }
  else if(event.key==='ArrowLeft'){ event.preventDefault(); stepViewer(-1); }
  else if(event.key==='ArrowRight'){ event.preventDefault(); stepViewer(1); }
  else if(event.key==='+'||event.key==='=') setZoom(zoom*1.22);
  else if(event.key==='-') setZoom(zoom*.82);
  else if(event.key==='0') fitGuide();
  else if(event.key==='1') actualGuide();
  else if(event.key==='Tab'){
    const buttons=[...guideModal.querySelectorAll('button')].filter(button=>!button.disabled&&!button.closest('[hidden]'));
    const first=buttons[0],last=buttons[buttons.length-1];
    if(event.shiftKey&&document.activeElement===first){ event.preventDefault(); last.focus(); }
    else if(!event.shiftKey&&document.activeElement===last){ event.preventDefault(); first.focus(); }
  }
});
// Lets the desktop shell reload images that finished downloading after the page opened.
window.l2dGallery={
  retryFailedImages(){ for(const card of grid.querySelectorAll('.card.image-failed')){ const img=card.querySelector('.thumb'); const src=img.getAttribute('src'); img.removeAttribute('src'); img.src=src; } },
  // Desktop only: ids saved in .desktop-data, and save(id,on) resolving to the saved ids.
  enableFavorites(ids,save){
    favorites=new Set(Array.isArray(ids)?ids:[]); saveFavorite=save;
    document.querySelector('#favoriteFilter').hidden=false;
    updateFavoriteCount(); render();
  }
};
try{
  const data=validateData(window.L2D_SKINS_DATA);
  skins=data.skins; skinById=new Map(skins.map(skin=>[skin.id,skin]));
  updatePageMeta(data); render();
}catch(error){ showDataError(error); }
</script>
</body>
</html>
